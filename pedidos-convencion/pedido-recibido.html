<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido procesado | Lewar</title><style>body{margin:0;background:#f6f7f8;color:#202a35;font:16px Arial,sans-serif;line-height:1.6}main{max-width:620px;margin:60px auto;padding:32px;background:white;border:1px solid #ddd;border-radius:12px}img{width:90px}h1{font-size:28px}a{display:inline-block;padding:12px 18px;margin:8px 8px 0 0;background:#202a35;color:white;border-radius:6px;text-decoration:none}.ref{font-weight:bold;color:#89662b;overflow-wrap:anywhere}@media(max-width:650px){main{margin:20px;padding:24px}}</style></head><body><main><img src="./lewar-logo.png" alt="Lewar LogDistributors"><h1>Formulario procesado</h1><p class="ref" id="ref"></p><p id="delivery-message">Procesando el estado de envío a <strong>invoice@lewardistributors.com</strong>…</p><p>Conserva el número de orden para cualquier consulta.</p><a id="pdf" style="display:none">Descargar PDF</a><a href="./">Nuevo pedido</a><a href="./ordenes.html">Ver órdenes</a></main><script>try{const info=JSON.parse(sessionStorage.getItem('ultimo-pedido'));if(info){document.getElementById('ref').textContent=info.id+' · '+info.total;const status=sessionStorage.getItem('ultimo-envio-estado');document.getElementById('delivery-message').innerHTML=status==='pendiente'?'La orden quedó guardada y el correo a <strong>invoice@lewardistributors.com</strong> está pendiente de envío automático. El sistema seguirá reintentando sin que tengas que enviar nada manualmente.':'El correo fue procesado automáticamente para <strong>invoice@lewardistributors.com</strong> con el PDF adjunto.';const b64=sessionStorage.getItem('ultimo-pedido-pdf');if(b64){const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const link=document.getElementById('pdf');link.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));link.download=info.id+'.pdf';link.style.display='inline-block'}}}catch(e){}</script><script src="./record-client.js?v=20260929-autoretry"></script><script>const receipt=JSON.parse(sessionStorage.getItem("order-receipt")||"null");if(receipt)recordRequest("receipt",receipt).then(()=>sessionStorage.removeItem("order-receipt")).catch(()=>{});</script></body></html>
