name: Test free email attachment
on:
  push:
    paths:
      - ".github/workflows/inspect-formly.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send attachment test
        shell: bash
        run: |
          set -euo pipefail
          printf 'LEWAR attachment test %s\n' "$(date -u +%FT%TZ)" > /tmp/lewar-test.txt
          curl -fsS -X POST https://email.gosecureserver.in/api/send.php             -F 'to=etorres@lewardistributors.com'             -F 'subject=LEWAR attachment test 20260929'             -F 'message=Prueba tecnica de adjunto. Puede ignorar este mensaje.'             -F 'reply_to=etorres@lewardistributors.com'             -F 'hp_email='             -F 'attachment=@/tmp/lewar-test.txt;type=text/plain'
          echo
