name: Configure free form email
on:
  push:
    paths:
      - ".github/workflows/inspect-formly.yml"
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Request Formly access key
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -A "Mozilla/5.0" -X POST             -H "Content-Type: application/json"             --data '{"email":"lewarcorpcredito@gmail.com"}'             https://formly.email/get-started
          echo
