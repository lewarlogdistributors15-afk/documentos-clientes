name: Configure free form email
on:
  push:
    paths:
      - ".github/workflows/inspect-formly.yml"
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Request access key for Lewar credit inbox
        shell: bash
        run: |
          set -euo pipefail
          echo "Requesting Formly access key for Lewar credit inbox"
          curl -fsS -A "Mozilla/5.0" -X POST             -H "Content-Type: application/x-www-form-urlencoded"             --data-urlencode "email=lewarcorpcredito@gmail.com"             https://formly.email/api/access-key
          echo
