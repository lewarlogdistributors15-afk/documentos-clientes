name: Probe public order actions
on:
  push:
    paths:
      - ".github/workflows/probe-public-orders.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check unauthenticated actions
        shell: bash
        run: |
          for action in list query search __probe__; do
            echo "=== $action ==="
            curl -sS -X POST 'https://lewar-convencion-whirlpool.emmatowwerz15.chatgpt.site/api/registro' \
              -H 'Content-Type: application/json' \
              -H 'Origin: https://lewarlogdistributors15-afk.github.io' \
              --data "{\"action\":\"$action\"}"
            echo
          done
