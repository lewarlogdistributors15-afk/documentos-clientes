<style>
:root{font-family:Arial,sans-serif;color:#202a35;background:#f6f7f8}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0}header{background:#080808;color:white}.top{max-width:1200px;margin:auto;padding:16px 24px;display:flex;align-items:center;gap:20px}.top img{width:72px;height:72px;object-fit:contain}.top strong{font-size:20px}
main{max-width:1200px;margin:auto;padding:28px 24px 60px}.nav{display:flex;gap:12px;flex-wrap:wrap}
a,button{font:inherit;border:1px solid #aeb7be;background:#fff;border-radius:7px;padding:11px 15px;color:#26313d;text-decoration:none;cursor:pointer}
h1{font-size:clamp(28px,4vw,38px);letter-spacing:-.04em;margin:26px 0 8px}.muted{color:#65717b;line-height:1.5}
.panel{background:white;border:1px solid #e1e5e8;border-radius:12px;padding:22px;margin-top:20px}
label{display:block;font-weight:700;margin-bottom:8px}input{font:inherit;width:100%;border:1px solid #cbd2d8;border-radius:7px;padding:12px}
.toolbar{display:flex;align-items:end;gap:14px;flex-wrap:wrap}.field{flex:1;min-width:220px}button{min-height:44px}
.summary{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0;color:#65717b;font-size:14px}
.scroll{overflow:auto;max-height:65vh;border:1px solid #e1e5e8;border-radius:8px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:13px 15px;border-bottom:1px solid #e5e9ec;text-align:left;vertical-align:top}

@media(max-width:650px){main{padding:22px 14px}.panel{padding:16px}.top{padding:12px 16px}.top strong{font-size:17px}th,td{padding:11px 9px}table{min-width:550px}}
</style>

<h1>Inventario disponible</h1>
<p id="access-status" class="muted" role="status">Verificando acceso…</p>
