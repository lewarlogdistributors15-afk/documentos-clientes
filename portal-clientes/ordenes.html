<meta name="robots" content="noindex,nofollow,noarchive">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');
:root{font-family:'DM Sans',Arial,sans-serif;color:#202a35;background:#f6f7f8}*{box-sizing:border-box}body{margin:0}header{background:#080808;border-bottom:1px solid #252525}.top{max-width:1440px;margin:auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}.top img{width:78px;height:78px;object-fit:contain}.brand{font-family:Manrope,sans-serif;color:#fff;font-weight:800;letter-spacing:-.03em}.brand span{border-bottom:3px solid #e4ac32}main{max-width:1440px;margin:auto;padding:30px 28px 60px}h1{font-family:Manrope,sans-serif;font-size:36px;letter-spacing:-.04em;margin:4px 0 6px}.eyebrow{font-size:12px;color:#69727c;letter-spacing:.12em;text-transform:uppercase;font-weight:700}.intro{color:#65717b}.panel{background:#fff;border:1px solid #e1e5e8;border-radius:12px;padding:22px;margin-top:20px;box-shadow:0 4px 20px #19233108}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.toolbar input{flex:1;min-width:260px;border:1px solid #cbd2d8;border-radius:7px;padding:12px;min-height:46px}.button,button{font:inherit;border:1px solid #aeb7be;background:white;border-radius:7px;padding:11px 15px;color:#26313d;text-decoration:none;cursor:pointer}.primary{background:#202a35;color:#fff;border-color:#202a35}.status{font-size:13px;color:#626e78;min-height:20px}.error{color:#a33c32}.scroll{overflow:auto;margin-top:16px}table{width:100%;border-collapse:collapse;min-width:1050px;font-size:14px}th,td{padding:12px;border-bottom:1px solid #e5e9ec;text-align:left;vertical-align:top}th{background:#f4f6f7;position:sticky;top:0;z-index:1}.money{text-align:right;white-space:nowrap}.pill{display:inline-block;border:1px solid #d5dce1;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700}.detail-btn{padding:7px 10px}.pdf-send{display:flex;gap:6px;margin-top:8px;min-width:310px}.pdf-send input{min-width:210px;border:1px solid #cbd2d8;border-radius:7px;padding:8px}.pdf-send button{white-space:nowrap}.details{background:#fafbfb;padding:14px;border-radius:8px;margin-top:8px;line-height:1.5}.details ul{margin:8px 0 0;padding-left:20px}.empty{text-align:center;color:#68737d;padding:34px}.top-actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:700px){main{padding:24px 15px}.top{padding:12px 15px}.top img{width:60px;height:60px}h1{font-size:29px}.toolbar{align-items:stretch}.toolbar input,.toolbar button{width:100%}}
</style>
</head>
<body>
<header><div class="top"><img src="../expo-muebles/lewar-logo.png" alt="Lewar LogDistributors"><div class="brand">Lewar LogDistributors · <span>Administración</span></div></div></header>
<main>
  <div class="top-actions">
    <a class="button" href="./">← Nuevo pedido</a>
    <button id="logout" type="button">Cerrar sesión</button>
  </div>
  <div style="margin-top:22px"><span class="eyebrow">Solo administradores</span><h1>Registro de órdenes</h1><p class="intro">Consulta las órdenes generadas desde el portal de clientes y las creadas por personal de Lewar.</p></div>
  <section id="access-panel" class="panel"><p id="access-status" class="status">Verificando acceso administrativo…</p></section>
  <section id="registry" class="panel" hidden>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Buscar por orden, cliente, vendedor o usuario que la creó">
      <button id="refresh" class="primary" type="button">Buscar / actualizar</button>
    </div>
    <p id="status" class="status"></p>
    <div class="scroll">
      <table>
        <thead><tr><th>Orden / fecha</th><th>Cliente</th><th>Vendedor</th><th>Creada por</th><th>Unidades</th><th class="money">Total</th><th>Estado</th><th>Correo</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="./orders.js?v=20261007-smtp2go-1"></script>
</body>
</html>
